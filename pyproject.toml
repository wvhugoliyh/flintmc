[build-system]
requires = ["uv_build >= 0.12.0, <= 0.13.1"]
build-backend = "uv_build"

[project]
name = "flintmc"
description = "A CLI tool designed to compile Flint code to Minecraft datapacks."
readme = "README.md"
version = "1.0.0a1"
requires-python = "==3.15.x"

dependencies = [
  "lark",
  "typer",
]

license = "MIT"
license-files = ["LICENSE"]

authors = [{name = "vhugoliyh", email = "vvhugoliyh@gmail.com"}]

[project.scripts]
flintmc = "flintmc:app"
