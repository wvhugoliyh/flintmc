[build-system]
requires = ["uv_build >= 0.12.3"]
build-backend = "uv_build"

[project]
name = "flintmc"
description = "A CLI tool to transpile Flint code into Minecraft datapacks"
version = "1.0.0"
requires-python = ">= 3.14"
readme = "README.md"
license = "MIT"
authors = [{ name = "Hugo Li", email = "vvhugoliyh@gmail.com" }]
dependencies = ["lark", "typer"]

[project.scripts]
flintmc = "src.main:app"

[tool.uv.build_backend]
module-name = "flintmc"
module-root = "src/"
