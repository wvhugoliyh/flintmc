name: Lint
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install UV
        uses: astral-sh/setup-uv@v10.3.0

      - name: Run Ruff
        run: uvx ruff check src/

      - name: Run Mypy
        run: uv run --with mypy mypy src/